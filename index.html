<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BulletFarm — Shop</title>
  <meta name="description" content="BulletFarm Shop — Produkte bestellen und Ressourcen sichern.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ═══ HEADER ═══ -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="brand" style="text-decoration:none">
        <div class="brand-logo">🎯</div>
        <div class="brand-text">
          <span class="brand-name" id="brandName">BulletFarm</span>
          <span class="brand-sub" id="brandSub">By Benzen</span>
        </div>
      </a>

      <nav class="nav">
        <button class="nav-btn active" id="navShop" onclick="showShopView()">
          🛍️ <span class="nav-label">Shop</span>
        </button>
        <button class="nav-btn" id="cartBtn">
          🛒 <span class="nav-label">Warenkorb</span>
          <span class="badge-count" id="cartCount" style="display:none">0</span>
        </button>
        <a href="admin.html" class="nav-btn" style="text-decoration:none">
          ⚙️ <span class="nav-label">Admin</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="main">
    <!-- Filters -->
    <div class="card mb-md fade-in">
      <div class="card-header" style="flex-wrap:wrap; gap:12px">
        <div class="flex items-center gap-sm">
          <h2>🛍️ Produkte</h2>
        </div>
        <div class="filters-row" style="flex:1; justify-content:flex-end">
          <select class="select" id="catFilter" style="width:auto; min-width:180px"></select>
          <select class="select" id="sortSelect" style="width:auto; min-width:180px">
            <option value="default">Sortierung: Standard</option>
            <option value="price_asc">💰 Preis aufsteigend</option>
            <option value="price_desc">💰 Preis absteigend</option>
            <option value="newest">🆕 Neueste zuerst</option>
            <option value="name">🔤 Alphabetisch</option>
          </select>
          <div class="search-input">
            <input class="input" id="searchInput" placeholder="Produkt suchen…">
          </div>
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid">
      <div class="spinner" style="grid-column:1/-1"></div>
    </div>
  </main>

  <!-- ═══ CART SLIDE-IN PANEL ═══ -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h3>🛒 Warenkorb</h3>
      <button class="btn btn-sm" id="closeCart">✕ Schließen</button>
    </div>
    <div class="cart-body" id="cartBody">
      <div class="empty-state">
        <div class="empty-state-icon">🛒</div>
        <div class="empty-state-text">Dein Warenkorb ist leer</div>
      </div>
    </div>
    <div class="cart-footer" id="cartFooter"></div>
  </aside>

  <!-- ═══ PRODUCT DETAIL MODAL ═══ -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📦 Produkt-Details</h3>
        <button class="btn btn-sm" id="closeProductModal">✕</button>
      </div>
      <div class="modal-body" id="productModalBody"></div>
    </div>
  </div>

  <!-- ═══ TOAST HOST ═══ -->
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/discord.js"></script>
  <script src="js/shop.js"></script>

  <script>
    function showShopView() {
      // currently only one view, but ready for expansion
    }
  </script>
</body>

</html>
